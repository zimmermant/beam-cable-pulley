<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beam held by a cable over a pulley</title>
<!--INLINE_CSS-->
</head>
<body>
<main class="stage" id="stage">
<div class="fig-fill">
<svg id="fig" viewBox="0 0 960 700" role="img" aria-label="Four diagrams of one beam. A horizontal beam runs from a pin in the wall at A to its free end at D, with a cable tied to it at B, taken up over a pulley at E on the ceiling and back down to a second tie at C; the weight that hung at D is left in outline, and the force at D can be dragged by the round handle at the arrow's tip. Beside and below it: the same beam as a single point carrying only the forces, the free-body diagram of the beam with the pin and the cable replaced by what they do, and the four forces drawn tip to tail."></svg>
</div>
<section id="controls" class="bar" aria-label="The force at D">
  <div class="ctl-head"><b>Force at D</b>
    &nbsp; F<sub>D</sub> = <b id="f-readout" class="readout">200</b>&nbsp;lb
    &nbsp; θ = <b id="dir-readout" class="readout">270</b>°
    <span id="dir-snap" class="snap-label">straight down</span>
  </div>
  <p id="from-link" hidden></p>
</section>
</main>
<!--INLINE_JS-->
</body>
</html>
