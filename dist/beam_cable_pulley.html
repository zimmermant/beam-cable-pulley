name(p.A.x + 6, P.baseY - 20, 'A', 'start');
name(p.B.x - 8, P.baseY - 20, 'B', 'end');
name(p.C.x + 10, P.baseY - 20, 'C', 'start');

function drawFbdArrows(svg, sh, arrows, cls) {

function drawPoint(svg, s) {

const o = { x: P.ox, y: P.oy };
heading(sh, P.headX, P.headY, 'The beam as a single point');
caption(sh, P.headX, P.headY + CAPTION_DY, 'the forces only, not where they act');

function drawExtended(svg, s) {

caption(sh, P.headX, P.headY + CAPTION_DY, 'one cable over a frictionless pulley, so both pulls are the same size');
if (d.slack) {
caption(sh, P.box.x1 - 8, P.headY + 2 * CAPTION_DY, SLACK_NOTE, COLORS.load, 'end');

for (const q of [p.A, p.B, p.C, p.D]) {
el('circle', { class: 'g dot', cx: q.x, cy: q.y, r: 4.5, fill: COLORS.ink }, svg);
sh.block(circleBox(q, 4.5));

if (f.mag !== 0) continue;

function drawPolygon(svg, s) {
const P = PANELS.poly;
const sh = sheet(svg, P);
const d = derive(s);
heading(sh, P.headX, P.headY, 'The forces tip to tail');
caption(sh, P.headX, P.headY + CAPTION_DY, 'in equilibrium the chain closes');
if (d.magD === 0) {
sh.fixed(P.x0, (P.y0 + P.y1) / 2, 'No force at D: nothing to balance.',

const order = ['load', 'cableB', 'cableC', 'pin'];

const drawn = [];
for (let i = 0; i < order.length; i++) {
const from = fit.map(verts[i]), to = fit.map(verts[i + 1]);
if (Math.hypot(to.x - from.x, to.y - from.y) < 1e-6) continue;    // a force of zero adds no side
sh.block(...arrow(svg, from, to, COLOR_OF[list[i].cls], SHAFT, `poly ${order[i]}`, HEAD_MAX));

const barN = 100, bar = barN * fit.scale;

el('line', { class: 'g scalebar', x1: P.x0, y1: by, x2: P.x0 + bar, y2: by, stroke: COLORS.faint, 'stroke-width': 3 }, svg);
sh.block(boxOf(P.x0, by - 2, P.x0 + bar, by + 2));
sh.fixed(P.x0 + bar + 7, by + 6, unitText(fmt(barN, 0), 'lb'), { size: SUB, anchor: 'start', fill: COLORS.faint });

drawn.forEach((sd, i) => sh.moving(forceLabel(sd.key, sd.mag), spots[i], COLOR_OF[sd.cls]));

function createScene(svg) {
return {
render(s) {
clear(svg);
rules(svg);
drawSpace(svg, s);
drawPoint(svg, s);
drawExtended(svg, s);
drawPolygon(svg, s);
}
};
}
// ===== controls.js =====
function controlsView(s) {
const text = {}, atSnap = {}, atMark = {};
for (const f of FIELDS) {
text[f.key] = fieldShow(f, s[f.key]);
if (f.snap) atSnap[f.key] = s[f.key] === snapAt(f);
if (f.mark) atMark[f.key] = s[f.key] === f.mark.value;
}
return { text, atSnap, atMark };
}
function controlsSetText(node, str) {
if (node.textContent !== str) node.textContent = str;
}
function createControls(parts) {
function render(s) {
const v = controlsView(s);
for (const f of FIELDS) {
if (parts.readouts[f.key]) controlsSetText(parts.readouts[f.key], v.text[f.key]);
if (f.snap && parts.snaps[f.key]) parts.snaps[f.key].classList.toggle('on', v.atSnap[f.key]);
if (f.mark && parts.marks[f.key]) parts.marks[f.key].classList.toggle('on', v.atMark[f.key]);

}
return { render };
}
// ===== interact.js =====
const DRAG_PX = 3;              // a press that moves less than this (screen px) was a click, not a drag

if (!finite(e.clientX) || !finite(e.clientY)) return null;
const r = svg.getBoundingClientRect();
if (!(r.width > 0) || !(r.height > 0)) return null;
const k = Math.min(r.width / VB.w, r.height / VB.h);
const left = r.left + (r.width - VB.w * k) / 2;
const top = r.top + (r.height - VB.h * k) / 2;
return { x: (e.clientX - left) / k, y: (e.clientY - top) / k };
}
function handleSpot(s) {
const a = loadArrow(s);
return a ? a.tip : handleRest();
}
function attachDrag(root, state) {

let detached = false;
const on = (target, type, fn) => {

state.set(loadFromHandle(tip, state.getState().dir));
}
function endDrag() {

dist(pt, spot) <= HANDLE_HIT;

function onPointerMove(e) {

// ===== app.js =====
const APP_TITLE = 'Beam held by a cable over a pulley';
function appStart() {
document.title = APP_TITLE;
const state = createState();
const fig = document.getElementById('fig');
const scene = createScene(fig);
const parts = { readouts: {}, snaps: {}, marks: {} };
for (const f of FIELDS) {
parts.readouts[f.key] = document.getElementById(`${f.id}-readout`);
if (f.snap) parts.snaps[f.key] = document.getElementById(`${f.id}-snap`);
if (f.mark) parts.marks[f.key] = document.getElementById(`${f.id}-mark`);
}
const controls = createControls(parts);
const presets = parsePresets(location.search);
state.set(presets.values);
const note = describePresets(presets);
const link = document.getElementById('from-link');
link.textContent = note;            // text only: the link's own text can never become markup
link.hidden = note === '';

const s = state.getState();
const active = typeof document.activeElement === 'object' && document.activeElement
&& typeof document.activeElement.getAttribute === 'function'
&& (document.activeElement.getAttribute('class') || '').includes('load-handle');

controls.render(s);
if (active && fig.querySelector) {

sync();
attachDrag(document.getElementById('stage'), state);
}
appStart();
})();
</script>
